<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B3A">
<meta name="description" content="Offline farm records: blocks, sprays, fertigation, stock and solar pumping.">
<title>Farm Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F5F6F2;--card:#fff;--line:#E2E5DD;--line2:#EEF0EA;--field:#D5DACF;--ink:#17211B;--mut:#5A6559;--acc:#2F6B3A;--acc2:#1F4A27;--accbg:#E4F0E5;--warn:#9A4D0B;--warnink:#6E3606;--warnbg:#FDF1E4;--warnline:#F1D2AE;--bad:#A3261F;--badink:#7A1C16;--badbg:#FBE9E7;--water:#1F5F8B;--waterbg:#E6EFF5;--sun:#C98A1B;--mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.mono{font-family:var(--mono)}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:0 2px env(safe-area-inset-bottom);z-index:5}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;font-size:10.5px;font-weight:500;color:var(--mut);text-decoration:none}
nav.tabs a.on{color:var(--acc);font-weight:700}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:15px;font-weight:600}
.eyebrow{font-size:13px;color:var(--mut);font-weight:500}
.sec{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 -6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
a.card{color:inherit;text-decoration:none}
.card.now{border:2px solid var(--acc)}
.card.dash{background:transparent;border:1px dashed #C9CFC3}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2);min-height:54px;color:inherit;text-decoration:none}
.item:last-child{border-bottom:0}
.item.planned{background:#FBFCFA}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;color:inherit;text-decoration:none}
.t{font-size:14px;font-weight:600}
.s{font-size:12px;color:var(--mut)}
.date{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--mut);width:50px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.v{font-family:var(--mono);font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dark{background:var(--ink);color:#F5F6F2;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dark .k{color:#B9C3B6}.dark .v{white-space:normal;text-overflow:clip;line-height:1.25}.dark .s{color:#D3DBD0}
.alert{background:var(--warnbg);border:1px solid var(--warnline);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;color:var(--warnink);text-decoration:none;font-size:13px}
.alert svg{flex:none;margin-top:1px}
.alert.bad{background:var(--badbg);border-color:#F0C4BF;color:var(--badink)}
.alert.ok{background:var(--accbg);border-color:#C5DEC8;color:var(--acc2)}
.alert.info{background:var(--waterbg);border-color:#C3D7E6;color:#123F5E}
.alert .t,.alert .s{color:inherit}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--field);background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px}
.btn.danger{color:var(--bad);border-color:#E7B9B4}
.btn.block{width:100%}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;flex:none;cursor:pointer}
.ib.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--field);background:#fff;font:inherit;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-warn{background:var(--warnbg);color:var(--warnink)}.b-ok{background:var(--accbg);color:var(--acc2)}.b-water{background:var(--waterbg);color:var(--water)}.b-bad{background:var(--badbg);color:var(--badink)}.b-mut{background:#ECEFE8;color:var(--mut)}.b-pri{background:var(--acc);color:#fff}
.grp{font-family:var(--mono);font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--accbg);color:var(--acc2);white-space:nowrap}
.bar{height:8px;background:var(--line2);border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#E9ECE5;border-radius:12px;padding:4px;gap:4px}
.seg a,.seg button{min-height:40px;border-radius:9px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--mut);display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.seg .on{background:#fff;color:var(--ink);font-weight:600}
.form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.lbl{font-size:13px;font-weight:600}
.hint{font-size:12px;color:var(--mut)}
input,select,textarea{min-height:48px;border:1px solid var(--field);border-radius:10px;background:#fff;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);width:100%}
textarea{min-height:84px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check{width:24px;height:24px;min-height:0;accent-color:var(--acc);flex:none;margin:0}
.empty{border:1px dashed #C9CFC3;border-radius:12px;padding:18px;text-align:center;color:var(--mut);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.back{align-self:flex-start;min-height:44px;display:flex;align-items:center;gap:4px;text-decoration:none;font-size:14px;font-weight:600;color:var(--acc);margin:-8px 0 -10px -4px}
.neg{color:var(--bad)!important}
.chart{height:90px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;align-items:end}
.chart i{display:block;border-radius:3px 3px 0 0;min-height:2px}
.prod{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#FBFCFA}
.stagerow{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fff}
.progress{position:relative;display:flex;gap:3px;height:12px}
.progress>i{display:block;height:100%;background:#E3E7DF}
.progress>i:first-child{border-radius:4px 0 0 4px}.progress>i:last-of-type{border-radius:0 4px 4px 0}
.progress>b{position:absolute;top:-4px;width:3px;height:20px;background:var(--ink);border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--acc)}
@media (min-width:600px){main{padding-top:28px}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<noscript><p style="padding:20px">Farm Manager needs JavaScript turned on.</p></noscript>
<script src="app.js"></script>
</body>
</html>
